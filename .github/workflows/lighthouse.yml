name: Weekly Lighthouse Audit

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site
        run: |
          npm ci
          npm run build

      - name: Audit ALL pages with Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          # Define a pasta do build para ele varrer TODAS as páginas HTML geradas
          staticDistDir: './dist'
          uploadTargets: 'temporary-public-storage'
          configFile: './lighthouserc.json'